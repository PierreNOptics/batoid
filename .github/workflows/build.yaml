name: Build Wheels

on:
  push:
    branches: [main, releases/0.8]
  pull_request:

env:
  CIBW_ARCHS_MACOS: x86_64 universal2
  CIBW_BUILD_VERBOSITY: 1
  CIBW_SKIP: "pp* cp36* cp37*"

jobs:
  build_wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BEFORE_ALL_MACOS: brew install cmake pkg-config
          CIBW_BEFORE_ALL_LINUX: yum install -y cmake pkgconfig || apt-get update && apt-get install -y cmake pkg-config
          CIBW_BEFORE_ALL_WINDOWS: ""

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
